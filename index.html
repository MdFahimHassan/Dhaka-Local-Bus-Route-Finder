<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find local bus routes in Dhaka by start and destination, in English or Bangla." />
  <title>Dhaka Local Bus Route Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather+Sans:wght@700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (fine for a demo; swap for a built CSS file for production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat text-white font-sans relative"
      style="background-image: url('assets/dhaka-night.webp');">

  <div class="fixed inset-0 bg-black/50 pointer-events-none"></div>

  <div class="relative grid grid-cols-1 md:grid-cols-[18rem_1fr] gap-6 max-w-6xl mx-auto px-4 py-8 min-h-screen">

    <!-- Sidebar: history -->
    <aside class="bg-white/10 backdrop-blur-sm rounded-xl p-4 overflow-y-auto self-start">
      <div class="flex items-center justify-between mb-4">
        <h2 id="historyTitle" class="text-xl font-bold text-teal-400">History</h2>
        <button id="clearHistoryBtn" type="button" class="text-sm text-slate-300 hover:text-teal-400 transition">
          Clear All
        </button>
      </div>
      <ul id="historyList" class="space-y-2"></ul>
    </aside>

    <!-- Main -->
    <main class="bg-white/10 backdrop-blur-sm rounded-xl p-6 flex flex-col items-center">
      <div class="w-full flex justify-end mb-2">
        <button id="langToggle" type="button"
                class="text-sm px-3 py-1 rounded-full border border-white/30 hover:bg-white/10 transition">
          বাংলা
        </button>
      </div>

      <h1 id="mainTitle" class="text-3xl font-bold text-amber-400 mb-6 text-center font-heading">
        🚍 Dhaka Local Bus Route Finder
      </h1>

      <form id="searchForm" class="w-full" autocomplete="off">
        <div class="relative mb-3">
          <input id="start" placeholder="Start location" aria-label="Start location"
                 class="w-full p-3 rounded-lg bg-gray-800 text-white"
                 autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search">
        </div>
        <div class="relative mb-3">
          <input id="end" placeholder="Destination" aria-label="Destination"
                 class="w-full p-3 rounded-lg bg-gray-800 text-white"
                 autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search">
        </div>
        <button id="searchBtn" type="submit"
                class="w-full bg-teal-500 py-3 rounded-lg mt-2 hover:bg-amber-500 text-gray-900 font-semibold transition">
          Search
        </button>
      </form>

      <div id="results" class="w-full mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    </main>
  </div>

  <!-- Details modal -->
  <div id="details" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50"
       role="dialog" aria-modal="true" aria-labelledby="busName">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-sm relative max-h-[85vh] overflow-y-auto">
      <div class="sticky top-0 flex justify-end">
        <button id="closeDetailsBtn" type="button" class="modal-close" aria-label="Close">✖</button>
      </div>
      <img id="busImage" class="w-full h-48 object-cover rounded-lg mb-3" alt="" />
      <h2 id="busName" class="text-xl font-bold text-teal-400"></h2>
      <p id="busBangla" class="text-gray-300 mb-2 font-bangla"></p>
      <p id="busService" class="text-sm text-gray-400 mb-2"></p>
      <p id="busTime" class="text-sm text-gray-400 mb-4"></p>
      <h3 id="routeTitle" class="text-lg font-semibold mb-2">Full Route:</h3>
      <ul id="busRoute" class="list-disc list-inside text-gray-200 space-y-1"></ul>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
